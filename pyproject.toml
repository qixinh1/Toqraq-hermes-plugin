[project]
name = "toqraq-hermes-plugin"
version = "0.1.0"
description = "Embed and observe game engines inside Hermes Desktop."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "fastapi==0.138.1",
    "httpx==0.28.1",
    "mypy==2.3.0",
    "pydantic==2.13.4",
    "PyYAML==6.0.3",
    "pytest==9.1.1",
    "ruff==0.16.2",
    "starlette==1.3.1",
    "websockets==15.0.1",
]

[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["toqraq", "toqraq.*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["toqraq", "tests/python"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "D", "C90"]
ignore = ["D203", "D213"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D104"]
"**/__init__.py" = ["N999"]
"tests/**" = ["D"]
"scripts/**" = ["D"]

[tool.pytest.ini_options]
addopts = ["--confcutdir=tests"]
testpaths = ["tests/python"]
markers = [
    "integration: requires a real engine binary and a Windows desktop session",
    "hermes_integration: requires a Hermes host source tree with manifest v2 support",
    "windows: requires Windows Job Object and process APIs",
]

[tool.mypy]
python_version = "3.11"
mypy_path = "."
files = [
    "toqraq",
    "dashboard/plugin_api.py",
    "__init__.py",
]
explicit_package_bases = true
strict = true
show_error_codes = true

[[tool.mypy.overrides]]
# Rich can discover IPython display helpers through Pydantic's optional
# presentation imports. That notebook-only graph is not a plugin dependency.
module = "IPython.*"
follow_imports = "skip"
