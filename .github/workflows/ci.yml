name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: >-
          python -m pip install --disable-pip-version-check
          --only-binary=:all: --require-hashes
          --requirement requirements-dev.txt
      - run: python -m ruff check toqraq dashboard tests scripts __init__.py
      - run: python -m ruff format --check toqraq dashboard tests scripts __init__.py
      - run: python -m mypy
      - run: python -m pytest -m "not integration"

  renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: 7de554277de632364c74fcf8641daa58a9a977d9
          path: hermes-agent
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: >-
          python -m pip install --disable-pip-version-check
          --only-binary=:all: --require-hashes
          --requirement requirements-dev.txt
      - run: npm ci
      - run: npm ci --workspace apps/desktop
        working-directory: hermes-agent
      - run: npm run typecheck
        env:
          TOQRAQ_HERMES_SOURCE: ${{ github.workspace }}/hermes-agent
      - run: npm run build
      - run: git diff --exit-code -- desktop/plugin.js
      - run: npm test
